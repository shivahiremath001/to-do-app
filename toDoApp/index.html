<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <style>
        body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: rgba(121, 121, 121, 0.068);
    margin: 30px;
    display:flex;
    flex-direction: column;
    align-items: center;
}
.card{
    margin: 20px;
    border: 3px solid rgba(0, 0, 0, 0.5);
    border-radius: 6px;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.062);

    min-height: 80vh;
    height: auto;
    width: 70vh;


    display:flex;
    flex-direction: column;
    
    align-items: center;

    background-color: rgba(252, 254, 255, 0.699);
}

#heading{
    font-weight: bold;
    color: hsla(0, 0%, 0%, 0.616);
    font-size: 1.2rem;
}
.inputAndAppend{
    margin: 0px 10px 10px 10px;
    display: flex;
}

#inputBox, #addTask{
    border: 2px solid rgba(0, 0, 0, 0.5);
    font-size: 1.2rem;
    border-radius: 4px;
    padding: 2px 4px;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.062);
}
#inputBox{
    width: 20rem;
}
#addTask{
    font-weight: bold;
    padding: 2px 8px;
    background: linear-gradient(rgba(0, 0, 0, 0.555), rgba(0, 0, 0, 0.397)) ;
    color: white;
    cursor: pointer;
    margin: 0 2px;
}
#addTask:hover{
    background: linear-gradient(rgba(95, 95, 95, 0.555), rgba(146, 145, 145, 0.397));
    color: black;
}

.taskContainer{
    margin-top: 4px;
    min-height: 60vh;
    width: 58vh;
    /* border: 2px solid rgba(0, 0, 0, 0.288); */
    border-radius: 1%;
    margin: 3px;
}

.tasks{
    margin: 4px 4px;
    width: 53.5vh;
}
.task{
    color: rgba(0, 0, 0, 0.753);
    font-size: large;
    display: flex;
    
    align-items: center;
}
.completed{
    text-decoration: line-through;
    opacity: 0.6; 
}

.removeBtn{   
    margin-left: 250px;
    background: red;
    color: white;
    border: none;
    border-radius: 15%;
    cursor: pointer;
    padding: 2px 6px;
    margin-left: auto;
}

.dateAndTime{
    font-size: 0.00001rem;
    line-height: 0.2rem;
    color: rgba(0, 0, 0, 0.438);
    margin-left: 40vh;

    opacity: 0;
    transition: opacity 0.3s ease, font-size 0.4s ease-out;
}
.tasks:hover .dateAndTime{
    font-size: 0.7rem;
    opacity: 1;
}
    </style>
</head>
<body>
    <div class="card">

        <div id="heading">
            <h2>TO DO LIST</h2>
        </div>

        <form class="inputAndAppend">
            <input type="text" id="inputBox" placeholder="Enter Task">
            <button type="submit" id="addTask">+</button>
        </form>

        <div class="taskContainer">
            
        </div>
    </div>
    <script>
    
    // TO DO LIST

const inputBox = document.getElementById("inputBox");
const inputForm = document.querySelector(".inputAndAppend");
const taskContainer = document.querySelector(".taskContainer");

// TASK BLOCK CONSTRUCTOR
class Task{
    constructor(task){
        this.element = document.createElement("div");
        this.element.classList.add("tasks");

        this.element.innerHTML = `
            <div class="task">
                <input type="checkbox" class="checkBox" 
                       id="task${task.id}" ${task.completed ? "checked": ""}>
                <label for="task${task.id}"
                class = "${task.completed ? "completed": ""}"
                >${task.name}</label>
                ${task.completed ? `<button class="removeBtn">X</button>` : ""}
            </div>  
            <p class="dateAndTime">Date: ${task.dateCreated}</p>
            <p class="dateAndTime">Time: ${task.timeCreated}</p>
        `;

        // checkbox functionality
        const checkbox = this.element.querySelector(".checkBox");
        const label = this.element.querySelector("label");

        checkbox.addEventListener("change", () =>{
            task.completed = checkbox.checked;
            saveData();
            renderTasks();
        });

        const removeBtn = this.element.querySelector(".removeBtn");

        if (removeBtn){
            removeBtn.addEventListener("click", () => {
                data.tasks = data.tasks.filter( t => t.id !== task.id);
                saveData();
                renderTasks();
            });
        }
    }
};

let data;
let saved = localStorage.getItem("toDoListData");

try {
    data = saved ? JSON.parse(saved) : { counter: 0, tasks: [] };
} catch (error) {
    console.error("Corrupted localStorage. Resetting...");
    data = { counter: 0, tasks: [] };
    localStorage.setItem("toDoListData", JSON.stringify(data));
}

renderTasks();

// APPEND NEW TASKS TO LIST
inputForm.addEventListener("submit", event => {
    event.preventDefault();

    if (!inputBox.value.trim()) return;

    if (!doesAlreadyExists()){
        appendTaskToList();
        renderTasks();
    }
    
    inputBox.value = "";
});


// RENDERING THE TASKS...
function renderTasks(){
    taskContainer.innerHTML = "";
    console.log("rendering:", data.tasks);

    const uncompleted = data.tasks.filter(task => !task.completed);
    const completed = data.tasks.filter(task => task.completed);

    // render uncompleted tasks 
    uncompleted.forEach(task =>{
        const newTaskElement = new Task(task);
        taskContainer.appendChild(newTaskElement.element);
    });
    // render completed tasks
    completed.forEach(task =>{
        const newTaskElement = new Task(task);
        taskContainer.appendChild(newTaskElement.element);
    });
}

function doesAlreadyExists(){
    return data.tasks.some(task => 
        task.name.toLowerCase() === inputBox.value.trim().toLowerCase()
    );
}


// APPEND TASK TO TASKLIST
function appendTaskToList(){
    const taskName = inputBox.value.trim();
    const [dateCreated, timeCreated] = getDateAndTime();

    data.tasks.push({id: data.counter++, name: taskName, dateCreated, timeCreated, completed: false});
    
    saveData();
}

// GET CURRENT DATE AND TIME
function getDateAndTime(){
    const date = new Date();
    const taskCreatedDate = `${date.getDate()}-${date.getMonth() + 1}-${date.getFullYear()}`;

    let amOrPm = date.getHours() >= 12? "pm": "am";
    const hours = date.getHours() % 12 || 12;
    
    const taskCreatedTime = `${hours}:${(date.getMinutes()).toString().padStart(2, 0)} ${amOrPm}`;

    return [taskCreatedDate, taskCreatedTime];
}

function saveData(){
    localStorage.setItem("toDoListData", JSON.stringify(data));
}


    </script>
</body>
</html>
